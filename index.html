<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e9">
<meta name="description" content="個人數位衣櫥，輕鬆管理外套、褲子與日常衣物。">
<link rel="manifest" href="manifest.json">
<title>煦衣 Closet｜我的衣櫥</title>
<style>
:root{--bg:#f6f3ed;--paper:#fffefa;--ink:#292923;--muted:#858276;--line:#e7e2d8;--accent:#6f7665;--soft:#eeece4;--danger:#a34e43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1050px;margin:auto;padding:24px 20px 100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand small{display:block;color:var(--muted);letter-spacing:.18em;font-size:10px;margin-bottom:5px}
.brand h1{font-family:Georgia,serif;font-weight:500;font-size:30px;letter-spacing:.03em;margin:0}
.header-note{font-size:12px;color:var(--muted)}
.hero{padding:24px 26px;border:1px solid var(--line);border-radius:18px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.hero h2{font-size:20px;font-weight:500;margin:0 0 7px}.hero p{font-size:13px;color:var(--muted);margin:0}
.primary{background:var(--ink);color:white;border:0;border-radius:999px;padding:12px 19px;font-size:13px;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}
.search{flex:1;min-width:190px}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#9a9d8e}
.toolbar select{width:auto;min-width:125px}
.summary{display:flex;justify-content:space-between;align-items:center;margin:16px 2px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eae7df}
.no-photo{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:#eeece5;color:#9a978d;font-size:12px}
.info{padding:12px 13px 13px}.category{font-size:10px;color:var(--accent);letter-spacing:.08em;margin-bottom:5px}
.name{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.meta{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}
.card-actions{display:flex;gap:7px;margin-top:11px}.small-btn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 10px;font-size:11px;color:#625f55}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;background:var(--paper);border:1px dashed #d8d2c6;border-radius:16px}
.empty .symbol{font-size:34px;color:#aaa597;margin-bottom:12px}.empty h3{font-weight:500;margin:0 0 8px}.empty p{font-size:12px;color:var(--muted);margin:0 0 18px}
footer{text-align:center;color:#aaa597;font-size:10px;margin-top:35px;letter-spacing:.08em}
.modal-backdrop{position:fixed;inset:0;background:#25251f77;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.modal-backdrop.show{display:flex}
.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:20px;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h2{font-size:19px;font-weight:500;margin:0}.close{border:0;background:var(--soft);border-radius:50%;width:32px;height:32px;font-size:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.field.full{grid-column:1/-1}
.photo-pick{border:1px dashed #cfc9bd;border-radius:12px;padding:18px;text-align:center;background:#f8f6f1;color:var(--muted);font-size:12px}
.photo-pick input{display:none}.photo-pick img{display:none;max-width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin:auto auto 10px}
.form-actions{display:flex;gap:9px;margin-top:17px}.form-actions button{flex:1}
.secondary{background:transparent;border:1px solid var(--line);border-radius:999px;padding:12px;color:var(--ink)}
.cat-row{display:flex;align-items:center;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fffefa}
.cat-name{flex:1;font-size:13px;min-width:0}.cat-count{font-size:10px;color:var(--muted);white-space:nowrap}
.cat-action{border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 8px;font-size:11px;color:#625f55}
.cat-action:disabled{opacity:.3;cursor:not-allowed}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#292923;color:white;padding:10px 16px;border-radius:999px;font-size:12px;display:none;z-index:10}
@media(max-width:760px){.app{padding:19px 14px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.hero{padding:19px;align-items:flex-start}.hero h2{font-size:18px}.header-note{display:none}.brand h1{font-size:27px}}
@media(min-width:761px){.modal-backdrop{align-items:center}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><small>YOUR PERSONAL WARDROBE</small><h1>煦衣 <span style="font-size:18px;color:#8b8a7d">Closet</span></h1></div>
  <div class="header-note">A considered collection of what you wear.</div>
</header>
<section class="hero">
  <div><h2>整理你的日常衣著</h2><p>用照片收藏每一件衣服，讓衣櫥一目了然。</p></div>
  <button class="primary" id="addBtn">＋ 新增衣物</button>
</section>
<div class="toolbar">
  <div class="search"><input id="search" placeholder="搜尋品牌、顏色或尺寸…" autocomplete="off"></div>
  <select id="categoryFilter"><option value="">所有類別</option><option>外套</option><option>褲子</option><option>上衣</option><option>襯衫</option><option>針織衫</option><option>洋裝</option><option>鞋子</option><option>配件</option><option>其他</option></select>
  <select id="sort"><option value="new">最近新增</option><option value="brand">品牌排序</option><option value="category">類別排序</option></select>
  <button class="secondary" id="manageCatsBtn" style="border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--paper);font-size:12px">管理類別</button>
</div>
<div class="summary"><span id="count">目前 0 件衣物</span><span>MY WARDROBE</span></div>
<section class="grid" id="grid"></section>
<footer>煦衣 CLOSET　·　A LITTLE MORE ORDER IN EVERYDAY LIFE</footer>
</div>

<div class="modal-backdrop" id="modalBackdrop">
<div class="modal">
  <div class="modal-head"><h2 id="modalTitle">新增衣物</h2><button class="close" id="closeModal" aria-label="關閉">×</button></div>
  <form id="itemForm">
    <div class="field">
      <label>衣物照片</label>
      <label class="photo-pick" for="photoInput">
        <img id="preview" alt="照片預覽"><span id="photoPrompt">點此拍照或從相簿選擇<br>建議使用單件衣物、光線清楚的照片</span>
      </label>
      <input id="photoInput" type="file" accept="image/*" capture="environment">
    </div>
    <div class="form-grid">
      <div class="field"><label for="category">類別 *</label><select id="category" required><option value="">請選擇</option><option>外套</option><option>褲子</option><option>上衣</option><option>襯衫</option><option>針織衫</option><option>洋裝</option><option>鞋子</option><option>配件</option><option>其他</option></select></div><div class="field"><label for="subcategory">子分類（選填）</label><select id="subcategory"><option value="">不指定子分類</option></select></div>
      <div class="field"><label for="brand">品牌</label><input id="brand" placeholder="例如：Loro Piana"></div>
      <div class="field"><label for="color">顏色</label><input id="color" placeholder="例如：深藍色"></div>
      <div class="field"><label for="size">尺寸</label><input id="size" placeholder="例如：48 / M / 32"></div>
    </div>
    <div class="form-actions"><button type="button" class="secondary" id="cancelBtn">取消</button><button type="submit" class="primary">儲存衣物</button></div>
  </form>
</div>
</div>
<div class="modal-backdrop" id="categoryBackdrop">
<div class="modal">
  <div class="modal-head"><h2>管理衣物類別</h2><button class="close" id="closeCats" aria-label="關閉">×</button></div>
  <p style="font-size:12px;color:var(--muted);margin:-7px 0 16px">可新增、重新命名、刪除及調整類別順序。已有衣物使用的類別，刪除前需先選擇移轉類別。</p>
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <input id="newCategory" placeholder="輸入新類別名稱" maxlength="20">
    <button class="primary" id="addCategoryBtn" style="padding:10px 16px">新增</button>
  </div>
  <div id="categoryList" style="display:grid;gap:8px"></div>
  <div class="form-actions"><button type="button" class="secondary" id="doneCats">完成</button></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const DB_NAME='xuyi-closet-db', STORE='items', CAT_STORE='categories';
const DEFAULT_CATEGORIES=['外套','褲子','上衣','襯衫','針織衫','洋裝','鞋子','配件','其他'];
let db, items=[], categories=[...DEFAULT_CATEGORIES], subcategories={}, editingId=null, photoData=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,2);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(CAT_STORE))d.createObjectStore(CAT_STORE,{keyPath:'name'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function allCategories(){return new Promise((resolve,reject)=>{const r=db.transaction(CAT_STORE).objectStore(CAT_STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
function saveCategories(list){return new Promise((resolve,reject)=>{const tx=db.transaction(CAT_STORE,'readwrite'),s=tx.objectStore(CAT_STORE);s.clear();list.forEach(name=>s.put({name,subcategories:[...(subcategories[name]||[])]}));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
function allItems(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
function saveItem(item){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(item);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});}
function removeItem(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error);});}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200);}

function refreshCategoryOptions(){
 const filter=$('categoryFilter'), current=filter.value;
 filter.innerHTML='<option value="">所有類別</option>'+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
 filter.value=categories.includes(current)?current:'';
 const categorySelect=$('category'), selectedCategory=categorySelect.value;
 categorySelect.innerHTML='<option value="">請選擇</option>'+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
 categorySelect.value=categories.includes(selectedCategory)?selectedCategory:'';
 refreshSubcategoryOptions();
}
function refreshSubcategoryOptions(selected=''){
 const main=$('category')?.value||'', select=$('subcategory');
 if(!select)return;
 const list=subcategories[main]||[];
 select.innerHTML='<option value="">不指定子分類</option>'+list.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
 select.value=list.includes(selected)?selected:'';
}
function renderCategoryManager(){
 $('categoryList').innerHTML=categories.map((c,i)=>{
 const used=items.filter(x=>x.category===c).length;
 const subs=(subcategories[c]||[]).map((s,j)=>`<div class="cat-row" style="margin:5px 0 5px 22px;background:#f8f6f1"><span class="cat-name">↳ ${esc(s)}</span><button type="button" class="cat-action" data-subrename="${i}:${j}">改名</button><button type="button" class="cat-action" data-subremove="${i}:${j}">刪除</button></div>`).join('');
 return `<div style="display:grid;gap:6px"><div class="cat-row"><button type="button" class="cat-action" data-up="${i}" ${i===0?'disabled':''}>↑</button><button type="button" class="cat-action" data-down="${i}" ${i===categories.length-1?'disabled':''}>↓</button><span class="cat-name">${esc(c)}</span><span class="cat-count">${used} 件</span><button type="button" class="cat-action" data-rename="${i}">改名</button><button type="button" class="cat-action" data-remove="${i}">刪除</button></div>${subs}<div style="display:flex;gap:7px;margin:0 0 8px 22px"><input data-subinput="${i}" placeholder="新增「${esc(c)}」子分類" maxlength="20" style="padding:8px;font-size:12px"><button type="button" class="cat-action" data-subadd="${i}">新增子分類</button></div></div>`;
 }).join('');
}
async function openCategoryManager(){renderCategoryManager();$('categoryBackdrop').classList.add('show');}
async function moveCategory(from,to){if(to<0||to>=categories.length)return;const v=categories.splice(from,1)[0];categories.splice(to,0,v);await saveCategories(categories);refreshCategoryOptions();renderCategoryManager();}

function render(){
 const q=$('search').value.trim().toLowerCase(),cat=$('categoryFilter').value,sort=$('sort').value;
 let list=items.filter(x=>(!cat||x.category===cat)&&[x.brand,x.color,x.size,x.category,x.subcategory||''].join(' ').toLowerCase().includes(q));
 list.sort((a,b)=>sort==='brand'?a.brand.localeCompare(b.brand,'zh-Hant'):sort==='category'?a.category.localeCompare(b.category,'zh-Hant'):b.created-a.created);
 $('count').textContent=`目前 ${items.length} 件衣物 · 顯示 ${list.length} 件`;
 $('grid').innerHTML=list.length?list.map(x=>`<article class="card">
 ${x.photo?`<img class="photo" src="${x.photo}" alt="${esc(x.brand||x.category)}">`:`<div class="no-photo">尚無照片</div>`}
 <div class="info"><div class="category">${esc(x.category)}${x.subcategory?` · ${esc(x.subcategory)}`:''}</div><div class="name">${esc(x.brand||'未填寫品牌')}</div><div class="meta">${x.color?`<span>${esc(x.color)}</span>`:''}${x.size?`<span>尺寸 ${esc(x.size)}</span>`:''}</div>
 <div class="card-actions"><button class="small-btn" data-edit="${x.id}">編輯</button><button class="small-btn" data-delete="${x.id}">刪除</button></div></div></article>`).join(''):`<div class="empty"><div class="symbol">＋</div><h3>${q||cat?'找不到符合的衣物':'你的衣櫥還是空的'}</h3><p>${q||cat?'試試其他搜尋條件。':'從拍攝第一件衣服開始，建立自己的數位衣櫥。'}</p>${q||cat?'':'<button class="primary" onclick="openForm()">新增第一件衣物</button>'}</div>`;
}
function openForm(item=null){
 editingId=item?.id||null;photoData=item?.photo||null;
 $('modalTitle').textContent=item?'編輯衣物':'新增衣物';
 $('category').value=item?.category||'';refreshSubcategoryOptions(item?.subcategory||'');$('brand').value=item?.brand||'';$('color').value=item?.color||'';$('size').value=item?.size||'';
 $('photoInput').value='';showPreview(photoData);$('modalBackdrop').classList.add('show');
}
function showPreview(src){$('preview').src=src||'';$('preview').style.display=src?'block':'none';$('photoPrompt').style.display=src?'none':'block';}
function closeForm(){$('modalBackdrop').classList.remove('show');$('itemForm').reset();photoData=null;editingId=null;showPreview(null);}
$('addBtn').onclick=()=>openForm();$('category').onchange=()=>refreshSubcategoryOptions();$('closeModal').onclick=closeForm;$('cancelBtn').onclick=closeForm;
$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeForm();};
$('photoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('請選擇圖片檔案');return;}photoData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f);});showPreview(photoData);};
$('itemForm').onsubmit=async e=>{e.preventDefault();const category=$('category').value;if(!category)return;
 const old=items.find(x=>x.id===editingId);const item={id:editingId||crypto.randomUUID(),category,subcategory:$('subcategory').value||'',brand:$('brand').value.trim(),color:$('color').value.trim(),size:$('size').value.trim(),photo:photoData,created:old?.created||Date.now(),updated:Date.now()};
 await saveItem(item);items=await allItems();closeForm();render();toast(old?'衣物資料已更新':'已加入你的衣櫥');};
$('grid').onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit){const x=items.find(i=>i.id===edit);if(x)openForm(x);}if(del){const x=items.find(i=>i.id===del);if(x&&confirm(`確定刪除「${x.brand||x.category}」嗎？`)){await removeItem(del);items=await allItems();render();toast('衣物已刪除');}}};
$('search').oninput=render;$('categoryFilter').onchange=render;$('sort').onchange=render;
$('manageCatsBtn').onclick=openCategoryManager;
$('closeCats').onclick=()=> $('categoryBackdrop').classList.remove('show');
$('doneCats').onclick=()=> $('categoryBackdrop').classList.remove('show');
$('categoryBackdrop').onclick=e=>{if(e.target===$('categoryBackdrop'))$('categoryBackdrop').classList.remove('show');};
$('addCategoryBtn').onclick=async()=>{const name=$('newCategory').value.trim();if(!name){toast('請輸入類別名稱');return;}if(categories.includes(name)){toast('這個類別已經存在');return;}categories.push(name);await saveCategories(categories);$('newCategory').value='';refreshCategoryOptions();renderCategoryManager();render();toast('已新增類別');};
$('categoryList').onclick=async e=>{
 // 使用 closest() 取得實際按鈕，避免手機瀏覽器點擊時事件目標不是按鈕本身，造成新增子分類失效。
 const button=e.target.closest('button');if(!button)return;
 const up=button.dataset.up,down=button.dataset.down,rename=button.dataset.rename,remove=button.dataset.remove;
 const subadd=button.dataset.subadd,subrename=button.dataset.subrename,subremove=button.dataset.subremove;
 if(subadd!==undefined){
  const i=Number(subadd);
  if(!Number.isInteger(i)||i<0||i>=categories.length){toast('主類別資料有誤，請重新整理');return;}
  const main=categories[i],input=$('categoryList').querySelector(`[data-subinput="${i}"]`),name=(input?.value||'').trim();
  if(!input){toast('找不到子分類輸入欄位，請重新開啟類別管理');return;}
  if(!name){toast('請輸入子分類名稱');input.focus();return;}
  subcategories[main]=Array.isArray(subcategories[main])?subcategories[main]:[];
  if(subcategories[main].some(s=>String(s).trim()===name)){toast('這個主類別下已經有相同的子分類');input.focus();return;}
  subcategories[main].push(name);
  try{await saveCategories(categories);renderCategoryManager();toast(`已新增「${name}」；「${main}」目前共有 ${subcategories[main].length} 個子分類`);}
  catch(err){subcategories[main].pop();console.error(err);toast('儲存子分類失敗，請稍後再試');}
  return;
 }
 if(subrename!==undefined){const [i,j]=subrename.split(':').map(Number),main=categories[i],old=subcategories[main][j],next=prompt('請輸入新的子分類名稱',old)?.trim();if(!next||next===old)return;if((subcategories[main]||[]).includes(next)){toast('子分類已存在');return;}subcategories[main][j]=next;items=items.map(x=>x.category===main&&x.subcategory===old?{...x,subcategory:next}:x);await saveCategories(categories);for(const item of items)await saveItem(item);refreshSubcategoryOptions();renderCategoryManager();render();toast('子分類及相關衣物已更新');return;}
 if(subremove!==undefined){const [i,j]=subremove.split(':').map(Number),main=categories[i],name=subcategories[main][j],used=items.filter(x=>x.category===main&&x.subcategory===name).length;if(used&&!confirm(`有 ${used} 件衣物使用「${name}」，刪除後將改為未指定子分類。確定刪除？`))return;items=items.map(x=>x.category===main&&x.subcategory===name?{...x,subcategory:''}:x);for(const item of items)await saveItem(item);subcategories[main].splice(j,1);await saveCategories(categories);refreshSubcategoryOptions();renderCategoryManager();render();toast('子分類已刪除');return;}
 if(up!==undefined){await moveCategory(Number(up),Number(up)-1);return;}
 if(down!==undefined){await moveCategory(Number(down),Number(down)+1);return;}
 if(rename!==undefined){const i=Number(rename),old=categories[i],next=prompt('請輸入新的類別名稱',old)?.trim();if(!next||next===old)return;if(categories.includes(next)){toast('這個類別名稱已存在');return;}categories[i]=next;subcategories[next]=subcategories[old]||[];delete subcategories[old];items=items.map(x=>x.category===old?{...x,category:next}:x);await saveCategories(categories);for(const item of items)await saveItem(item);refreshCategoryOptions();renderCategoryManager();render();toast('類別及相關衣物已更新');return;}
 if(remove!==undefined){const i=Number(remove),name=categories[i],used=items.filter(x=>x.category===name).length;if(categories.length<=1){toast('至少需要保留一個類別');return;}let target='';if(used){target=prompt(`「${name}」目前有 ${used} 件衣物。請輸入要移轉到的既有類別：\n${categories.filter(c=>c!==name).join('、')}`,categories.find(c=>c!==name));if(!target)return;if(target===name||!categories.includes(target)){toast('請選擇有效的其他類別');return;}items=items.map(x=>x.category===name?{...x,category:target,subcategory:''}:x);for(const item of items)await saveItem(item);}if(!confirm(`確定刪除「${name}」類別嗎？`))return;categories.splice(i,1);delete subcategories[name];await saveCategories(categories);refreshCategoryOptions();renderCategoryManager();render();toast('類別已刪除');}
};
$('categoryList').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('input[data-subinput]')){e.preventDefault();const i=e.target.dataset.subinput;$('categoryList').querySelector(`button[data-subadd="${i}"]`)?.click();}};
(async()=>{try{db=await openDB();items=await allItems();const stored=await allCategories();if(stored.length){categories=stored.map(x=>x.name);subcategories=Object.fromEntries(stored.map(x=>[x.name,Array.isArray(x.subcategories)?x.subcategories:[]]));}else{categories=[...DEFAULT_CATEGORIES];subcategories={};await saveCategories(categories);}refreshCategoryOptions();render();}catch(e){console.error(e);toast('資料庫啟動失敗，請重新整理頁面');}})();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
